# Config for the kanban demo: Tasks opens as a board with two extra columns.
[vim]
enabled = true
which_key_hints = true
which_key_hint_mode = "timed"
which_key_hint_timeout_ms = 250

[editor]
line_number_mode = "relative"
word_wrap = true

[view]
tasks_view_mode = "kanban"
kanban_group_by = "status"
kanban_statuses = ["review", "blocked"]

[kanban_column_titles]
review = "In Review"
blocked = "Blocked"

[terminal]
mouse = true
preview_style = "auto"
