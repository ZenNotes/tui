name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/zn

  # The contracts against a real server, built from the server's main branch.
  # Nothing here can skip: the tests only skip when the binary is not set.
  server-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      ZENNOTES_SERVER_CONTRACT_BINARY: ${{ github.workspace }}/.znserver-bin/zennotes-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenNotes/znserver
          ref: main
          path: .znserver
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build -trimpath -o "$ZENNOTES_SERVER_CONTRACT_BINARY" ./cmd/zennotes-server
        working-directory: .znserver
      - run: go test -count=1 ./internal/mcp ./internal/remote

  homebrew:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@082c94ee19e776205cfa8e43802917d1425e2fe7 # main
      - run: python3 -B -m unittest discover -s packaging/homebrew -p 'test_*.py'
      - name: Load the formula under test
        run: |
          brew trust zennotes/tap
          brew tap zennotes/tap
          mkdir -p "$(brew --repository zennotes/tap)/Formula"
          cp packaging/homebrew/Formula/zn.rb "$(brew --repository zennotes/tap)/Formula/zn.rb"
      - run: brew style packaging/homebrew/Formula/zn.rb
      - run: brew audit --strict zennotes/tap/zn
      - run: brew install zennotes/tap/zn
      - run: brew test zennotes/tap/zn
